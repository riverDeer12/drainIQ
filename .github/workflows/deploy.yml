name: Deploy to production

# Runs on the self-hosted runner installed on the Windows Server itself
# (see deploy/windows/deploy.ps1 for the prerequisites it assumes are
# already on that machine). No inbound access to the server is needed -
# the runner polls GitHub over an outbound connection.
on:
  push:
    branches: [master]
  workflow_dispatch: {}   # lets you trigger a deploy manually from the Actions tab, no push needed

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # deploy.ps1 itself does a git pull (step 2/6), but that happens only
      # AFTER it has already started running - so a fix to the script, or to
      # a default like $PgBinPath, wouldn't take effect until the run after
      # the one that pulls it. Pull first so the script that's about to run
      # is always the one from this exact commit.
      - name: Pull latest source
        shell: powershell
        run: |
          git -C C:\src\drainIQ pull

      - name: Deploy to IIS
        shell: powershell
        # -AspNetCoreEnvironment Development is a deliberate choice here (not
        # the safe default) so /scalar/v1 is browsable on the live site for
        # demoing to the city. It also re-enables DbSeeder.cs's auto-seeder,
        # which just no-ops since a device row already exists.
        run: |
          C:\src\drainIQ\deploy\windows\deploy.ps1 -PgSuperPassword "${{ secrets.PG_SUPER_PASSWORD }}" -AspNetCoreEnvironment Development
